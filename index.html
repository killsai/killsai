<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kills_ai - Valorant Coach</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f1923;
            color: #ece8e1;
            font-family: 'Segoe UI', sans-serif;
            padding: 16px;
            margin: 0;
        }
        h2 { color: #ff4655; margin-top: 0; }
        .card {
            background: #1f2326;
            border: 1px solid #363b3e;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ff4655;
            background: #0f1923;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        button {
            width: 100%;
            background: #ff4655;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #e03e4d; }
    </style>
</head>
<body>
    <h2>🎯 kills_ai — Панель тренера</h2>

    <div class="card">
        <label for="player">Никнейм и тег (Player#TAG):</label>
        <input type="text" id="player" placeholder="Например: Player#EU1">

        <label for="weapon">Основное оружие:</label>
        <select id="weapon">
            <option value="Vandal">🎯 Vandal</option>
            <option value="Phantom">🎯 Phantom</option>
            <option value="Guardian">🎯 Guardian</option>
            <option value="Operator">🔭 Operator (Авик)</option>
            <option value="Spectre">🔫 Spectre</option>
            <option value="Other">🔄 Смешанный арсенал</option>
        </select>

        <label for="crouch">Привычка приседать:</label>
        <select id="crouch">
            <option value="cr_Never">🚫 Вообще не сажусь</option>
            <option value="cr_Sometimes">⚖️ Иногда (по ситуации)</option>
            <option value="cr_Always">⬇️ Постоянно зажимаю Ctrl</option>
        </select>
    </div>

    <button id="send-btn">Запросить разбор</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('send-btn').addEventListener('click', () => {
            const player = document.getElementById('player').value.trim();
            const weapon = document.getElementById('weapon').value;
            const crouch = document.getElementById('crouch').value;

            if (!player.includes('#')) {
                alert('Укажи корректный ник с тегом через решетку #!');
                return;
            }

            // Отправляем данные обратно в бот
            tg.sendData(JSON.stringify({
                player: player,
                weapon: weapon,
                crouch: crouch
            }));
        });
    </script>
</body>
</html>
